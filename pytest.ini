[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Markers for test organization
markers =
    unit: Unit test (single component isolation)
    integration: Integration test (multiple components)
    requires_llm: Test requires localhost:8000 LLM endpoint
    agent: Agent-related test
    config: Configuration-related test
    task_io: Task file I/O test
    slow: Long-running test (skip with -m "not slow")

# Strict marker checking
addopts = --strict-markers -ra

# Timeout (prevent hanging tests)
timeout = 300
timeout_method = thread
