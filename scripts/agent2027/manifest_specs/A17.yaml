# A17 · CAP-1 scale ladder, F2 rows (docs/ablations/A17_CAP1_scale_ladder.md §4, A17-T6;
# pre-registration Part V.17 and Part VII.1 item 14, SR4 fallback; Amendment 2 CL2).
#   python scripts/agent2027/make_manifest.py --ablation A17 -> manifests/agent2027/A17_CAP-1.csv
#
# SR4 fallback (2026-10-19): row numbers follow A17 §4 exactly; rows that no longer exist
# are left as gaps, never renumbered:
#   - f2_O20 A17-059…069 dropped (O20 failed SR4);
#   - CL2 (small-rung real data on junglechess + myocardial only): A17-016, -017, -027,
#     -028, -045, -046, -056, -057 are not generated (vehicle, heart at Q0.8/Q2/Q4/Q9);
#   - F0 pools A17-101…177 are NOT in this manifest. They are generated by X7's
#     f0_generate.py / f0_clients.sh (A17-T7, not built) and need the F0 prompt amendment
#     (pre-registration Part VIII.2, "before first F0 row"); the prompt is a DRAFT for
#     Henrik (docs/agent2027/X7_F0_prompt_DRAFT.md). F0 rows must never be planned into a
#     session read by ro27_clients_manifest.sh, which would run them as Full-v2.
# Image: plain Full-v2 (env_overrides = {} except D4) on the frozen image agent2027-v2.0.
# D4: SYN-P classification rows (synp_p3, p4, p5) carry ROGUE_ONE_STRATIFIED_FOLDS=True,
# exactly as A05's SYN-P rows; real data rows never do.
# Ports are planning fields (rungs.csv); uniform rows use the live server port of their
# session (make_manifest --plan-session --port stamps it).
ablation_id: A17
defaults:
  image_tag: agent2027-v2.0
  cap_hours: 6
  replicates: [0]
  expected_u: 0.75
templates:
  synp: &synp {classification: {ROGUE_ONE_STRATIFIED_FOLDS: "True"}}
