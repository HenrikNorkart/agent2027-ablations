# A12 · FX: 2^(4-1) half-fraction, planner x assessment x pruning x memory
# (docs/ablations/A12_FX_component_half_fraction.md §4; flags rogueone/utils/fx_switches.py, E9d).
#   python scripts/agent2027/make_manifest.py --ablation A12 -> manifests/agent2027/A12_FX.csv
# Rows 001-056: 8 cells x SYN-P 7, numbered by task (p3, p5, p2, p6a, p6b, p4, p1), cells in
# table order. 057-064: G0b-1 smoke (all 8 cells, synp_p3, 1 fold x 3 iterations; never analysed).
# 065: Full guard on v2.3 (same task and overrides as A05-901, whose S1016t dump is
# prompt-baseline-v2.0; 10 iterations; never analysed). RV3 rows 066-093 are added only if G4
# triggers them (A12-T23). D4: SYN-P classification rows carry ROGUE_ONE_STRATIFIED_FOLDS=True.
# J+ cells set ROGUE_ONE_PRUNING_SHADOW=1 (shadow J-a, logged only).
ablation_id: A12
cells:  # env_overrides per cell (anchors; make_manifest reads only defaults/blocks)
  pAJM: &pAJM {ROGUE_ONE_PLANNER_MODE: none, ROGUE_ONE_PRUNING_SHADOW: "1"}
  PaJM: &PaJM {ROGUE_ONE_ASSESSMENT_MODE: template, ROGUE_ONE_PRUNING_SHADOW: "1"}
  PAjM: &PAjM {ROGUE_ONE_PRUNING_MODE: rules}
  PAJm: &PAJm {ROGUE_ONE_MEMORY_MODE: amnesic, ROGUE_ONE_PRUNING_SHADOW: "1"}
  pajM: &pajM {ROGUE_ONE_PLANNER_MODE: none, ROGUE_ONE_ASSESSMENT_MODE: template, ROGUE_ONE_PRUNING_MODE: rules}
  paJm: &paJm {ROGUE_ONE_PLANNER_MODE: none, ROGUE_ONE_ASSESSMENT_MODE: template, ROGUE_ONE_MEMORY_MODE: amnesic, ROGUE_ONE_PRUNING_SHADOW: "1"}
  pAjm: &pAjm {ROGUE_ONE_PLANNER_MODE: none, ROGUE_ONE_PRUNING_MODE: rules, ROGUE_ONE_MEMORY_MODE: amnesic}
  Pajm: &Pajm {ROGUE_ONE_ASSESSMENT_MODE: template, ROGUE_ONE_PRUNING_MODE: rules, ROGUE_ONE_MEMORY_MODE: amnesic}
defaults:
  image_tag: agent2027-v2.3
  rung: O120
  port: 8010
  cap_hours: 6
  expected_u: 0.85
  fold_seeds: [42]
  replicates: [0]
  env_overrides_by_task_type:
    classification: {ROGUE_ONE_STRATIFIED_FOLDS: "True"}
